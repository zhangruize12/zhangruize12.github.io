<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome - zhangruize12</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d1117; color: #e6edf3;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            min-height: 100vh; padding: 20px;
            display: flex; justify-content: center; align-items: flex-start;
        }
        .app {
            max-width: 960px; width: 100%;
            background: #161b22; border-radius: 24px;
            padding: 28px 30px 34px;
            border: 1px solid #30363d;
        }
        .register-screen { display: flex; flex-direction: column; align-items: center; padding: 30px 20px 40px; gap: 22px; }
        .register-screen h1 { font-size: 2.6rem; font-weight: 700; background: linear-gradient(135deg, #f0883e, #f6a85b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .register-screen .sub { color: #8b949e; font-size: 0.95rem; margin-top: -8px; }
        .user-list { width: 100%; max-width: 480px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 6px 0; }
        .user-tag {
            background: #21262d; border-radius: 40px; padding: 6px 16px 6px 20px;
            display: flex; align-items: center; gap: 10px; font-size: 0.95rem;
            border: 1px solid #30363d; transition: 0.2s;
        }
        .user-tag:hover { border-color: #f0883e; }
        .user-tag .name { cursor: pointer; }
        .user-tag .name:hover { color: #f6a85b; }
        .user-tag .del-btn {
            background: transparent; border: none; color: #8b949e; cursor: pointer;
            font-size: 1.1rem; line-height: 1; padding: 0 4px;
        }
        .user-tag .del-btn:hover { color: #f0883e; }
        .register-screen .input-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .register-screen input {
            background: #0d1117; border: 1px solid #30363d; border-radius: 40px;
            padding: 14px 24px; font-size: 1.1rem; color: #e6edf3; width: 260px; outline: none;
        }
        .register-screen input:focus { border-color: #f0883e; box-shadow: 0 0 0 3px rgba(240, 136, 62, 0.25); }
        .register-screen button {
            background: #f0883e; border: none; border-radius: 40px;
            padding: 14px 36px; font-size: 1.1rem; font-weight: 600;
            color: #0d1117; cursor: pointer; transition: 0.2s;
        }
        .register-screen button:hover { background: #f6a85b; transform: scale(1.02); }
        .register-screen .hint { color: #484f58; font-size: 0.8rem; margin-top: -6px; }

        .game-screen { display: none; flex-direction: column; gap: 18px; }
        .game-screen.active { display: flex; }
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 12px; border-bottom: 1px solid #30363d;
        }
        .topbar .user { display: flex; align-items: center; gap: 12px; font-size: 1.15rem; }
        .topbar .user .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: #f0883e; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1.2rem; color: #0d1117;
        }
        .topbar .logout-btn {
            background: transparent; border: 1px solid #30363d; border-radius: 30px;
            padding: 6px 18px; color: #8b949e; cursor: pointer;
        }
        .topbar .logout-btn:hover { border-color: #f0883e; color: #f0883e; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
            gap: 14px; background: #0d1117; border-radius: 16px;
            padding: 18px 20px; border: 1px solid #30363d;
        }
        .stat-item .label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }
        .stat-item .value { font-size: 1.3rem; font-weight: 600; }
        .stat-item .value.gold { color: #f6a85b; }
        .stat-item .value.green { color: #7ee787; }
        .stat-item .value.cyan { color: #79c0ff; }
        .stat-item .value.purple { color: #d2a8ff; }
        .stat-item .value.orange { color: #f0883e; }

        .section-title { font-size: 1.2rem; font-weight: 600; margin: 8px 0 4px; display: flex; align-items: center; gap: 10px; }
        .section-title small { font-weight: 400; font-size: 0.8rem; color: #8b949e; }

        .table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid #30363d; background: #0d1117; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.92rem; min-width: 600px; }
        th { text-align: left; padding: 12px 14px; background: #161b22; color: #8b949e; font-weight: 500; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid #30363d; }
        td { padding: 10px 14px; border-bottom: 1px solid #21262d; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .factor-name { font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .factor-name .badge { font-size: 0.6rem; background: #30363d; padding: 2px 8px; border-radius: 30px; color: #8b949e; }
        .factor-name .badge.unlocked { background: #1f3a2a; color: #7ee787; }
        .factor-name .badge.locked { background: #3d1f1f; color: #f0883e; }
        .factor-mult, .factor-invest { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
        .action-cell { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .action-cell input { width: 80px; background: #0d1117; border: 1px solid #30363d; border-radius: 30px; padding: 6px 12px; color: #e6edf3; font-size: 0.85rem; outline: none; }
        .action-cell input:focus { border-color: #f0883e; }
        .action-cell input::placeholder { color: #484f58; font-size: 0.7rem; }
        .btn { border: none; border-radius: 30px; padding: 6px 16px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .btn-primary { background: #f0883e; color: #0d1117; }
        .btn-primary:hover { background: #f6a85b; }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-unlock { background: #1f6f3a; color: #e6edf3; }
        .btn-unlock:hover { background: #2d8f4a; }
        .btn-unlock:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-reset { background: #a83e3e; color: #e6edf3; padding: 10px 28px; font-size: 1rem; border-radius: 40px; }
        .btn-reset:hover { background: #c44a4a; }
        .btn-reset:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-upgrade { background: #1f6f3a; color: #e6edf3; padding: 10px 28px; font-size: 1rem; border-radius: 40px; }
        .btn-upgrade:hover { background: #2d8f4a; }
        .btn-upgrade:disabled { opacity: 0.4; cursor: not-allowed; }
        .upgrade-area {
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
            gap: 14px; background: #0d1117; border-radius: 16px;
            padding: 14px 20px; border: 1px solid #30363d; margin-top: 4px;
        }
        .upgrade-area .info .cost { color: #8b949e; font-size: 0.9rem; }
        .upgrade-area .info .cost strong { color: #f6a85b; }
        .reset-area {
            display: flex; align-items: center; justify-content: flex-end; gap: 20px;
            background: #0d1117; border-radius: 16px; padding: 10px 20px; border: 1px solid #30363d;
            margin-top: 4px;
        }
        .reset-area .info { color: #8b949e; font-size: 0.9rem; }
        .reset-area .info strong { color: #f0883e; }
        .empty-tip { color: #484f58; text-align: center; padding: 30px 10px; font-size: 0.95rem; }

        @media (max-width: 700px) { .app { padding: 16px 14px; } .stats-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 480px) { .user-tag { font-size: 0.8rem; padding: 4px 12px; } }
    </style>
</head>
<body>
    <div class="app" id="app">
        <h1>zhangruize12 的主站</h1>
        <h3>玩小游戏到/projectn，如https://zhangruize12.github.io/project1</h3>
        <div class="hint">更新历史 请移步仓库 https://github.com/zhangruize12/zhangruize12.github.io</div>
    </div>
</body>
</html>
